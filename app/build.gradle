apply plugin: 'com.android.application'

android {
    compileSdkVersion = 37

    defaultConfig {
        applicationId = "com.android.keepass"
        minSdkVersion 23
        targetSdkVersion 34

        multiDexEnabled true

        versionCode = 222
        versionName = "2.6.9.2"

        testApplicationId = "com.keepassdroid.tests"
        testInstrumentationRunner = "androidx.test.runner.AndroidJUnitRunner"


        ndkVersion '28.2.13676358'
        ndk {
            abiFilters 'x86', 'x86_64', 'armeabi-v7a', 'arm64-v8a'
        }

        lintOptions {
            baseline file("lint-baseline.xml")
        }
    }

    externalNativeBuild {
        cmake {
            path "src/main/jni/CMakeLists.txt"
        }
    }


    buildTypes {
        release {
            minifyEnabled = false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    flavorDimensions "store"

    productFlavors {
        general {
            dimension = "store"
        }

        play {
            dimension = "store"
        }
    }
    namespace 'com.android.keepass'

}

dependencies {

    implementation ('org.bouncycastle:bcprov-jdk15to18:1.84') {
        exclude group: 'junit'
    }
    implementation 'joda-time:joda-time:2.14.2'
    implementation 'androidx.core:core:1.19.0'
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.biometric:biometric:1.1.0"
    implementation "androidx.preference:preference:1.2.1"
    implementation "androidx.activity:activity:1.13.0"
    implementation "com.google.android.material:material:1.14.0"
    implementation "androidx.multidex:multidex:2.0.1"
    implementation "androidx.loader:loader:1.1.0"
    implementation(platform("org.jetbrains.kotlin:kotlin-bom:1.8.22"))
    implementation 'androidx.lifecycle:lifecycle-viewmodel:2.11.0'
    implementation 'androidx.lifecycle:lifecycle-livedata:2.11.0'

    androidTestImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test:runner:1.7.0'
    androidTestImplementation 'androidx.test:rules:1.7.0'
}

buildscript {
    repositories {
        maven {
            url "https://plugins.gradle.org/m2/"
        }
    }
    dependencies {
    }
}


tasks.withType(JavaCompile).configureEach {
    options.compilerArgs += [
    ]
}